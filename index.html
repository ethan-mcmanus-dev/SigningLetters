<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify</title>
</head>
<body>
<p id="status">Pending</p>
<pre id="msg"></pre>

<script type="module">
import * as openpgp from 'https://cdn.jsdelivr.net/npm/openpgp@5/+esm';

const MSG_PENDING = "Pending";
const MSG_OK      = "Authentic - signed by Ethan McManus";
const MSG_BAD     = "Invalid - signature does not verify";
const MSG_NONE    = "No signed message provided in the link.";

const PUBLIC_KEY = `-----BEGIN PGP PUBLIC KEY BLOCK-----

xjMEanWAwxYJKwYBBAHaRw8BAQdAqqxGcXotYky1wfDLHCYWqe9JZuxRndRg
U2dSPOd9shzNDUV0aGFuIE1jTWFudXPCjAQQFgoAPgWCanWAwwQLCQcICZDC
dZHC15lnBQMVCAoEFgACAQIZAQKbAwIeARYhBL94muy8nkXU6NMBNsJ1kcLX
mWcFAACMVQEAxbttgELnmBGFAMelyKpM7+edhbnt3RWld/8W75zPgcMBAKc6
S7jsRDQ6UOUOhlhhHHkTS3hWZmuhhKK9Kq1otUIHzjgEanWAwxIKKwYBBAGX
VQEFAQEHQApJqAeuAtWy9EAW/UFJ/j1zM/dV8Ro/44sv8UUl2uwCAwEIB8J4
BBgWCgAqBYJqdYDDCZDCdZHC15lnBQKbDBYhBL94muy8nkXU6NMBNsJ1kcLX
mWcFAACPZwD5ATjXUjtHC35DKU0YWxdWMmZLaQJnom1HbOlhTv3UUIcA/1zy
Cblx1Txi3448XtVzbHmYte8VzCbXDE0i8nO0u7MD
=eEc4
-----END PGP PUBLIC KEY BLOCK-----
`;

const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');
statusEl.textContent = MSG_PENDING;

try {
  const encoded = location.hash.slice(1);
  if (!encoded) { statusEl.textContent = MSG_NONE; throw new Error('no hash'); }

  const SIGNED = decodeURIComponent(escape(atob(encoded)));

  const pubKey = await openpgp.readKey({ armoredKey: PUBLIC_KEY });
  const signedMsg = await openpgp.readCleartextMessage({ cleartextMessage: SIGNED });
  const result = await openpgp.verify({ message: signedMsg, verificationKeys: pubKey });
  msgEl.textContent = signedMsg.getText();
  await result.signatures[0].verified;
  statusEl.textContent = MSG_OK;
  msgEl.textContent += "\n\nThis public key was certified by Jim Chen (PGP).";
} catch (e) {
  if (statusEl.textContent === MSG_PENDING) statusEl.textContent = MSG_BAD;
  console.error(e);
}
</script>
</body>
</html>
