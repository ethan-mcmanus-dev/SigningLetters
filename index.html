<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify</title>
</head>
<body>
<p id="status">Pending</p>
<pre id="msg"></pre>

<script type="module">
import * as openpgp from 'https://cdn.jsdelivr.net/npm/openpgp@5/+esm';

const MSG_PENDING = "Pending";
const MSG_OK      = "Authentic - signed by Ethan McManus";
const MSG_BAD     = "Invalid - signature does not verify";
const MSG_NONE    = "No signed message provided in the link.";

const PUBLIC_KEY = `-----BEGIN PGP PUBLIC KEY BLOCK-----

mDMEamUmzhYJKwYBBAHaRw8BAQdAnkVxL648oUOQk+jStMRvpZKJIlI7IXv1rGG7
Dnbx05O0DUV0aGFuIE1jTWFudXOIjAQQFgoAPgWCamUmzgQLCQcICZCL/G1zb+8p
gQMVCAoEFgACAQIZAQKbAwIeARYhBBHPO1ShgF/MLs1Ryov8bXNv7ymBAAA9MQD/
Y7oC2sblM03bwKKGwaN7b6UnbEUYAOO1xzNpooi8k2cBAIWde3/OFxHGOXS7jw9a
S73ON9rcJ1Aezi6SQRL/tKwPiHUEEBYKAB0WIQRjwJn1mfe4Hq+3r4ZwIpBG1KNE
ZgUCamUvywAKCRBwIpBG1KNEZsK+AP93LIKG455VQBO0iZi2LL3ExRTsqZ9TbkCG
FggC8VsWRgD9FwSDgZpkSq9dwQCkOZW9PhEJEw+ALPWyjw2WZm3v8wK4OARqZSbO
EgorBgEEAZdVAQUBAQdAQidwZ1U7qDlXRxNDxHAWfhUdFl5+oW0QJQJDlEDirF4D
AQgHiHgEGBYKACoFgmplJs4JkIv8bXNv7ymBApsMFiEEEc87VKGAX8wuzVHKi/xt
c2/vKYEAAPV/AP9fMGzxSFb9810XabNGBHF+CUT9sCE+l2tE83qZ016IIAEAxFWU
dzOdLZyg1uAm85nzACFnuL76Nhc96neuiZGIawg=
=xb3x
-----END PGP PUBLIC KEY BLOCK-----
`;

const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');
statusEl.textContent = MSG_PENDING;

try {
  const encoded = location.hash.slice(1);
  if (!encoded) { statusEl.textContent = MSG_NONE; throw new Error('no hash'); }

  const SIGNED = decodeURIComponent(escape(atob(encoded)));

  const pubKey = await openpgp.readKey({ armoredKey: PUBLIC_KEY });
  const signedMsg = await openpgp.readCleartextMessage({ cleartextMessage: SIGNED });
  const result = await openpgp.verify({ message: signedMsg, verificationKeys: pubKey });
  msgEl.textContent = signedMsg.getText();
  await result.signatures[0].verified;
  statusEl.textContent = MSG_OK;
} catch (e) {
  if (statusEl.textContent === MSG_PENDING) statusEl.textContent = MSG_BAD;
  console.error(e);
}
</script>
</body>
</html>
